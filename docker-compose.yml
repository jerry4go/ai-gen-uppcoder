services:
  ai-gen:
    build: .
    container_name: ai-gen
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ai-gen-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
    restart: unless-stopped

volumes:
  ai-gen-data:
